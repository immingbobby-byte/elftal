<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elftal</title>
<meta name="theme-color" content="#14532d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --ink:#15211a; --muted:#64716a; --line:#e2e7e3;
  --brand:#166534; --brand-ink:#fff; --brand-soft:#dcfce7;
  --a:#334155; --a-soft:#e2e8f0; --b:#c2410c; --b-soft:#ffedd5;
  --win:#15803d; --draw:#a16207; --loss:#b91c1c;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1411; --card:#17201b; --ink:#e7efe9; --muted:#93a39a; --line:#26322b;
    --brand:#22c55e; --brand-ink:#05200f; --brand-soft:#123321;
    --a:#cbd5e1; --a-soft:#243041; --b:#fb923c; --b-soft:#3a2416;
    --win:#4ade80; --draw:#facc15; --loss:#f87171;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--brand);color:var(--brand-ink);padding:16px 16px 14px}
@media (prefers-color-scheme: dark){header{background:#123321;color:var(--ink)}}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.8}
.hbtn{background:rgba(255,255,255,.15);color:inherit;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
body.viewer nav{display:none}
body.viewer{padding-bottom:16px}
main{max-width:640px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--muted);padding:9px 4px 10px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;font-weight:500}
.chip.on{background:var(--brand-soft);border-color:var(--brand)}
.chip .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.chip.on .dot{background:var(--brand);border-color:var(--brand)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:12px;padding:10px 12px}
.team.a{background:var(--a-soft)} .team.b{background:var(--b-soft)}
.team h3{margin:0 0 6px;font-size:14px}
.team.a h3{color:var(--a)} .team.b h3{color:var(--b)}
.team ul{list-style:none;margin:0;padding:0}
.team li{padding:2px 0;display:flex;justify-content:space-between;gap:6px}
.team li.mv{cursor:pointer;border-radius:6px;padding:4px 6px;margin:0 -6px}
.team li.mv:hover{background:rgba(127,127,127,.12)}
.joker{margin-top:10px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);font-size:14px}
.sugg{border:2px solid transparent;cursor:pointer}
.sugg.sel{border-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{width:28px;color:var(--muted);text-align:left}
td.pts{font-weight:700}
.score{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.score input{width:64px;text-align:center;font-size:24px;font-weight:700}
.match{border-top:1px solid var(--line);padding:10px 0}
.match:first-of-type{border-top:0}
.res{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.pick{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center}
.pick label{display:contents}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.onA{background:var(--a-soft);color:var(--a);font-weight:600}
.seg button.onB{background:var(--b-soft);color:var(--b);font-weight:600}
.seg button.onJ{background:var(--brand-soft);color:var(--brand);font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.status{font-size:12px}
.err{color:var(--loss)}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.form{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.form i{width:9px;height:9px;border-radius:50%;display:inline-block}
.form i.W{background:var(--win)} .form i.G{background:var(--draw)} .form i.V{background:var(--loss)}
.lnk{color:inherit;text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.bar>div{height:100%;background:var(--brand)}
.badge{display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px;color:#fff}
.badge.W{background:var(--win)} .badge.G{background:var(--draw)} .badge.V{background:var(--loss)}
@media (prefers-color-scheme: dark){.badge{color:#0e1411}}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.mini{font-size:12px;margin-left:4px;letter-spacing:1px}
.verdict{font-size:12px;margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--bg);display:inline-block}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 2px}
.meter>div:first-child{background:var(--a)} .meter>div:last-child{background:var(--b)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:110px;resize:vertical}
.pm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.pm:last-child{border-bottom:0}
.pm .src{color:var(--muted);font-size:12px}
.tagok{color:var(--win);font-weight:600} .tagq{color:var(--draw);font-weight:600} .tagno{color:var(--muted)}
.wa{background:#25D366;border-color:#25D366;color:#fff;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="row spread" style="flex-wrap:nowrap">
    <div><h1>⚽ Elftal</h1><div class="sub" id="status">Laden…</div></div>
    <button id="adminBtn" class="hbtn" onclick="openAdmin()">🔒 Beheer</button>
  </div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="aanwezig"><span class="i">✅</span>Aanwezig</button>
  <button data-tab="suggestions"><span class="i">🔀</span>Teams</button>
  <button data-tab="uitslag"><span class="i">📝</span>Uitslag</button>
  <button data-tab="stand"><span class="i">🏆</span>Stand</button>
</nav>
<div id="toast"></div>

<script>
const SB_URL = "https://brdatkcvtpcvcxiqueeb.supabase.co";
const SB_KEY = "sb_publishable_O4fCFeacXsXpcwvGi-Z9Mw_nzpOCU6q";
const ROW_ID = 1;
const TEAM_A = "Zonder hesje", TEAM_B = "Met hesje";
const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

let state = null;
let tab = "aanwezig";
let suggestions = [];
let selSugg = 0;
let editIdx = null;      // index in uitslagen being edited
let draft = null;        // uitslag form draft

/* ---------- Supabase (REST) ---------- */
const H = {apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json"};
async function fetchState(){
  const r = await fetch(`${SB_URL}/rest/v1/elftal_state?id=eq.${ROW_ID}&select=data`, {headers: H});
  if(!r.ok) throw new Error("Laden mislukt (" + r.status + ")");
  const rows = await r.json();
  if(!rows.length) throw new Error("Geen data gevonden");
  return normalize(JSON.parse(rows[0].data));
}
function normalize(s){
  s.players ??= []; s.uitslagen ??= []; s.lastTeams ??= []; s.avoidPairs ??= [];
  s.matches ??= []; s.seasons ??= [];
  return s;
}
/* ---------- Seizoenen ---------- */
let seasonSel = "cur";   // "cur", "all" of index in state.seasons
const curSeasonName = ()=> state.seasonName || "Huidig seizoen";
function allState(){ return {...state, uitslagen: [...(state.seasons||[]).flatMap(x=>x.uitslagen||[]), ...state.uitslagen]}; }
function standState(){
  if(seasonSel==="all") return allState();
  if(seasonSel!=="cur" && state.seasons[seasonSel]) return {...state, uitslagen: state.seasons[seasonSel].uitslagen||[]};
  return state;
}
function seasonLabel(){ return seasonSel==="all" ? "Alle seizoenen" : seasonSel!=="cur" && state.seasons[seasonSel] ? state.seasons[seasonSel].name : curSeasonName(); }
function seasonPicker(){
  if(!(state.seasons||[]).length) return "";
  return `<div class="row small" style="margin-bottom:10px">Seizoen:
    <select onchange="seasonSel=this.value==='cur'||this.value==='all'?this.value:+this.value;render()">
      <option value="cur" ${seasonSel==="cur"?"selected":""}>${esc(curSeasonName())} (nu)</option>
      ${state.seasons.map((x,i)=>`<option value="${i}" ${seasonSel===i?"selected":""}>${esc(x.name)}</option>`).reverse().join("")}
      <option value="all" ${seasonSel==="all"?"selected":""}>Alle seizoenen</option>
    </select></div>`;
}
// Haal altijd eerst de nieuwste versie op, pas de wijziging toe en sla op.
let queue = Promise.resolve();
function mutate(fn, msg, allowSetup, forceBackup){ if(!isAdmin && !allowSetup){ toast("Alleen de beheerder kan dit aanpassen"); return Promise.resolve(false); } const run = queue.then(()=>doMutate(fn, msg, forceBackup)); queue = run.catch(()=>{}); return run; }
/* ---------- Automatische back-up ----------
   Voor een wijziging wordt de vorige versie als extra rij in dezelfde tabel bewaard
   (maximaal 1 per 10 minuten, of altijd bij belangrijke acties). De laatste 60 blijven bewaard. */
const BACKUP_EVERY = 10*60*1000, BACKUP_KEEP = 60;
async function saveBackup(raw){
  const r = await fetch(`${SB_URL}/rest/v1/elftal_state`, {method:"POST", headers:{...H, Prefer:"return=minimal"}, body: JSON.stringify({id: Date.now(), data: raw})});
  if(!r.ok) throw new Error("Back-up mislukt (" + r.status + ")");
  try{ // oude back-ups opruimen
    const old = await (await fetch(`${SB_URL}/rest/v1/elftal_state?id=neq.${ROW_ID}&select=id&order=created_at.desc&offset=${BACKUP_KEEP}`, {headers:H})).json();
    if(old.length) await fetch(`${SB_URL}/rest/v1/elftal_state?id=in.(${old.map(o=>o.id).join(",")})`, {method:"DELETE", headers:H});
  }catch{}
}
async function listBackups(){
  const r = await fetch(`${SB_URL}/rest/v1/elftal_state?id=neq.${ROW_ID}&select=id,created_at,data&order=created_at.desc&limit=${BACKUP_KEEP}`, {headers:H});
  if(!r.ok) throw new Error("Back-ups laden mislukt (" + r.status + ")");
  return (await r.json()).map(b=>{ let d={}; try{ d=JSON.parse(b.data); }catch{} return {id:b.id, at:b.created_at, raw:b.data, nU:(d.uitslagen||[]).length, nP:(d.players||[]).length, nS:(d.seasons||[]).length}; });
}
async function doMutate(fn, msg, forceBackup){
  setStatus("Opslaan…");
  try{
    const fresh = await fetchState();
    const before = JSON.stringify(fresh);
    fn(fresh);
    if(forceBackup || !fresh.lastBackupAt || Date.now() - Date.parse(fresh.lastBackupAt) > BACKUP_EVERY){
      try{ await saveBackup(before); fresh.lastBackupAt = new Date().toISOString(); }
      catch(e){ console.warn(e); if(forceBackup) throw e; }
    }
    const r = await fetch(`${SB_URL}/rest/v1/elftal_state?id=eq.${ROW_ID}`, {
      method: "PATCH", headers: {...H, Prefer: "return=minimal"},
      body: JSON.stringify({data: JSON.stringify(fresh)})
    });
    if(!r.ok) throw new Error("Opslaan mislukt (" + r.status + ")");
    state = fresh; checkAdmin();
    setStatus("Opgeslagen");
    if(msg) toast(msg);
    render();
    return true;
  }catch(e){
    setStatus(e.message, true); toast(e.message);
    return false;
  }
}

/* ---------- Helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);}
function setStatus(t, err){const el=document.getElementById("status");el.textContent=t;el.className="sub"+(err?" err":"");}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function fmtDate(iso){const [y,m,d]=iso.split("-").map(Number);return `${d} ${MONTHS[m-1]} ${y}`;}

/* ---------- Beheer (wachtwoord) ---------- */
// Let op: dit is een afscherming in de app zelf. Kijkers zien alleen de stand.
const ADMIN_KEY = "elftal_admin";
let isAdmin = false, adminView = false;
const lsGet = k=>{ try{ return localStorage.getItem(k); }catch{ return null; } };
const lsSet = (k,v)=>{ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch{} };
async function hashPw(pw){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("elftal-v1:" + pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function checkAdmin(){
  isAdmin = !!(state && state.adminHash && lsGet(ADMIN_KEY) === state.adminHash);
  document.body.classList.toggle("viewer", !isAdmin);
  const b = document.getElementById("adminBtn"); if(b) b.textContent = isAdmin ? "🔓 Beheerder" : "🔒 Beheer";
  if(state && !isAdmin && tab !== "stand"){ tab = "stand"; }
}
function openAdmin(){ adminView = true; render(); scrollTo(0,0); }
function closeAdmin(){ adminView = false; render(); }
function viewAdmin(){
  const has = !!state.adminHash;
  if(isAdmin) return `<div class="card"><h2>🔓 Je bent beheerder</h2>
    <p class="small muted">Op dit apparaat kun je alles aanpassen. Anderen met de link zien alleen de stand.</p>
    <div class="row"><button class="btn" onclick="closeAdmin()">← Terug</button><button class="btn danger" onclick="logout()">Uitloggen</button></div></div>
    <div class="card"><h2>📅 Seizoenen</h2>
      <form class="row" onsubmit="renameSeason(event)"><label class="small" style="flex:1;min-width:160px">Naam huidig seizoen<br><input id="sname" value="${esc(curSeasonName())}" style="width:100%"></label><button class="btn">Opslaan</button></form>
      <p class="small muted">${state.uitslagen.length} wedstrijden in ${esc(curSeasonName())}${state.uitslagen.length?`, vanaf ${esc(chrono(state)[0].date)}`:""}.</p>
      <form onsubmit="closeSeason(event)"><label class="small">Naam van het nieuwe seizoen<br><input id="snew" placeholder="bijv. Seizoen 2027" style="width:100%"></label>
        <button class="btn danger" style="width:100%;margin-top:8px" ${state.uitslagen.length?"":"disabled"}>Seizoen afsluiten en nieuw beginnen</button></form>
      <p class="small muted">De stand begint dan opnieuw. Het oude seizoen blijft terug te kijken via de keuzelijst bij de stand. Spelers blijven staan; de teamindeling kijkt naar alle seizoenen.</p>
      ${state.seasons.length?`<ul class="list">${state.seasons.map(x=>`<li><span>${esc(x.name)}</span><span class="small muted">${(x.uitslagen||[]).length} wedstr. · ${esc(x.fromDate||"")} – ${esc(x.toDate||"")}</span></li>`).reverse().join("")}</ul>`:""}
    </div>
    <div class="card"><h2>🛟 Back-ups</h2>
      <p class="small muted">Voor elke wijziging wordt automatisch een back-up gemaakt (maximaal elke 10 minuten, en altijd bij verwijderen of seizoen afsluiten). De laatste ${BACKUP_KEEP} worden bewaard.</p>
      <div class="row"><button class="btn" onclick="backupNow()">Nu back-up maken</button><button class="btn" onclick="downloadJSON(JSON.stringify(state,null,2),'elftal-'+todayISO()+'.json')">⬇ Download huidige data</button></div>
      <div id="backups" style="margin-top:10px"><button class="btn sm" onclick="showBackups()">Back-ups bekijken</button></div>
    </div>
    <div class="card"><h2>Wachtwoord wijzigen</h2>
    <form onsubmit="changePw(event)" class="row"><input type="password" id="pw1" placeholder="Nieuw wachtwoord" autocomplete="new-password" style="flex:1;min-width:140px"><input type="password" id="pw2" placeholder="Herhaal" autocomplete="new-password" style="flex:1;min-width:140px"><button class="btn primary">Opslaan</button></form></div>`;
  if(!has) return `<div class="card"><h2>Wachtwoord instellen</h2>
    <p class="small muted">Er is nog geen beheerderswachtwoord. Kies er een; daarna kun alleen jij nog iets aanpassen.</p>
    <form onsubmit="changePw(event)"><div class="row"><input type="password" id="pw1" placeholder="Wachtwoord" autocomplete="new-password" style="flex:1;min-width:140px"><input type="password" id="pw2" placeholder="Herhaal" autocomplete="new-password" style="flex:1;min-width:140px"></div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" onclick="closeAdmin()">Annuleren</button><button class="btn primary" style="flex:1">Instellen</button></div></form></div>`;
  return `<div class="card"><h2>🔒 Inloggen als beheerder</h2>
    <form onsubmit="login(event)"><input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" style="width:100%">
    <div class="row" style="margin-top:10px"><button type="button" class="btn" onclick="closeAdmin()">Annuleren</button><button class="btn primary" style="flex:1">Inloggen</button></div></form>
    <p class="small muted" style="margin-bottom:0">Je blijft op dit apparaat ingelogd tot je uitlogt.</p></div>`;
}
async function login(e){ e.preventDefault(); const h = await hashPw(document.getElementById("pw").value);
  if(h === state.adminHash){ lsSet(ADMIN_KEY, h); adminView=false; checkAdmin(); tab="aanwezig"; render(); toast("Ingelogd als beheerder"); }
  else toast("Wachtwoord klopt niet"); }
function logout(){ lsSet(ADMIN_KEY, null); adminView=false; checkAdmin(); render(); toast("Uitgelogd"); }
async function changePw(e){ e.preventDefault(); const a=document.getElementById("pw1").value, b=document.getElementById("pw2").value;
  if(a.length<4){ toast("Minimaal 4 tekens"); return; } if(a!==b){ toast("Wachtwoorden zijn niet gelijk"); return; }
  const h = await hashPw(a), first = !state.adminHash;
  const ok = await mutate(s=>{ if(!first && !isAdmin) throw new Error("Geen rechten"); if(first && s.adminHash) throw new Error("Er is intussen al een wachtwoord ingesteld"); s.adminHash = h; }, first?"Wachtwoord ingesteld":"Wachtwoord gewijzigd", true);
  if(ok){ lsSet(ADMIN_KEY, h); adminView=false; checkAdmin(); if(first) tab="aanwezig"; render(); } }

function renameSeason(e){ e.preventDefault(); const n=document.getElementById("sname").value.trim(); if(!n) return; mutate(s=>{ s.seasonName=n; }, "Naam opgeslagen"); }
function closeSeason(e){ e.preventDefault(); const nn=document.getElementById("snew").value.trim() || "Seizoen " + (new Date().getFullYear()+1);
  if(!confirm(`${curSeasonName()} afsluiten en "${nn}" beginnen? De stand begint opnieuw.`)) return;
  mutate(s=>{ const asc=[...s.uitslagen].sort((a,b)=>(a.dateISO||"").localeCompare(b.dateISO||""));

/* ---------- Stand ---------- */
function computeStats(s){
  const st = {};
  const get = n => st[n] ??= {name:n, w:0, g:0, v:0, gs:0, pts:0, gd:0};
  const cap = x => Math.max(-3, Math.min(3, x));   // een 10-0 telt als +3
  for(const u of s.uitslagen){
    const a = +u.scoreA, b = +u.scoreB;
    for(const [team, mine, theirs] of [[u.teamA||[], a, b], [u.teamB||[], b, a]]){
      for(const n of team){
        const p = get(n); p.gs++; p.gd += cap(mine - theirs);
        if(mine > theirs) p.w++; else if(mine === theirs) p.g++; else p.v++;
      }
    }
    if(u.joker){ // joker krijgt het resultaat van het winnende team
      const p = get(u.joker); p.gs++; p.gd += cap(Math.abs(a - b));
      if(a === b) p.g++; else p.w++;
    }
  }
  for(const p of Object.values(st)) p.pts = p.w*3 + p.g;
  return st;
}
function standing(s){
  return Object.values(computeStats(s)).sort((x,y)=> y.pts-x.pts || (y.pts/y.gs)-(x.pts/x.gs) || y.w-x.w || x.name.localeCompare(y.name));
}

/* ---------- Vorm, reeksen, opkomst, profiel ---------- */
function chrono(s){ return [...s.uitslagen].sort((x,y)=>(x.dateISO||"").localeCompare(y.dateISO||"")); }
// Per speler een lijst wedstrijden in chronologische volgorde
function playerHistory(s){
  const h = {};
  for(const u of chrono(s)){
    const a=+u.scoreA, b=+u.scoreB, A=u.teamA||[], B=u.teamB||[];
    const add=(n,res,mates,opps,side)=>(h[n]??=[]).push({u,res,mates,opps,side});
    A.forEach(n=>add(n, a>b?"W":a===b?"G":"V", A.filter(x=>x!==n), B, "A"));
    B.forEach(n=>add(n, b>a?"W":a===b?"G":"V", B.filter(x=>x!==n), A, "B"));
    if(u.joker) add(u.joker, a===b?"G":"W", [], [], "J");
  }
  return h;
}
function streaks(list){
  let bestW=0, bestUnb=0, w=0, unb=0;
  for(const m of list){ w = m.res==="W"? w+1:0; unb = m.res!=="V"? unb+1:0; bestW=Math.max(bestW,w); bestUnb=Math.max(bestUnb,unb); }
  let cur=0, curType=null;
  for(let i=list.length-1;i>=0;i--){ const r=list[i].res; if(curType===null) curType=r; if(r!==curType) break; cur++; }
  return {bestW, bestUnb, cur, curType};
}
const formDots = (list,n=5)=>`<span class="form" title="laatste ${n}">${list.slice(-n).map(m=>`<i class="${m.res}"></i>`).join("")}</span>`;
const RES_TXT = {W:"gewonnen", G:"gelijk", V:"verloren"};
function attendance(s){
  const total = s.uitslagen.length, h = playerHistory(s);
  return Object.entries(h).map(([n,l])=>({name:n, n:l.length, pct: total? Math.round(l.length/total*100):0})).sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name));
}

/* ---------- Teams indelen ---------- */
// Sterkte = punten per wedstrijd + een beetje doelsaldo, afgevlakt zodat nieuwe spelers op gemiddeld niveau starten
function strength(stats, n){
  const p = stats[n]; const k = 2, prior = 1.5;
  return p ? (p.pts + prior*k)/(p.gs + k) + 0.15*(p.gd||0)/(p.gs + k) : prior;
}
function predict(sa, sb){
  const d = sa - sb, pA = 1/(1+Math.exp(-1.1*d));
  const ad = Math.abs(d), fav = d>0?"A":"B";
  const label = ad<0.4 ? "gelijkwaardig" : ad<1.2 ? "lichte favoriet" : "duidelijke favoriet";
  return {d, pA, fav: ad<0.4?null:fav, label};
}
function predText(pr){ return pr.fav ? `${pr.fav==="A"?TEAM_A:TEAM_B} ${pr.label}` : "Gelijkwaardig"; }
function meter(pr){ const a=Math.round(pr.pA*100); return `<div class="meter"><div style="width:${a}%"></div><div style="width:${100-a}%"></div></div><div class="row spread small muted"><span>${a}% kans</span><span>${predText(pr)}</span><span>${100-a}% kans</span></div>`; }
// Eerlijkheidscheck: per wedstrijd de verwachting op basis van alleen de wedstrijden daarvoor
function fairness(s){
  const asc = chrono(s), out = new Map();
  for(let i=0;i<asc.length;i++){
    const u = asc[i], prior = {uitslagen: asc.filter(x=>(x.dateISO||"") < (u.dateISO||""))};
    const st = computeStats(prior);
    const known = [...(u.teamA||[]),...(u.teamB||[])].filter(n=>st[n]).length;
    if(!prior.uitslagen.length || known < 2){ out.set(u, null); continue; }
    const sa = teamSum(u.teamA||[], st), sb = teamSum(u.teamB||[], st), pr = predict(sa, sb);
    const a=+u.scoreA, b=+u.scoreB, margin=Math.abs(a-b), winner = a>b?"A":b>a?"B":null;
    let icon, txt, hit;
    if(!pr.fav){ hit = margin<=1; icon = hit?"✅":"⚖️"; txt = hit?"Leek gelijkwaardig en was spannend":"Leek gelijkwaardig, toch ruim"; }
    else if(winner===pr.fav){ hit=true; icon="✅"; txt="Favoriet won"; }
    else if(!winner){ hit=false; icon="🤝"; txt="Gelijk, ondanks favoriet"; }
    else { hit=false; icon="😮"; txt="Verrassing: underdog won"; }
    out.set(u, {sa, sb, pr, margin, hit, icon, txt, fav: pr.fav});
  }
  return out;
}

/* ---------- Badges ---------- */
const BADGES = [
  {id:"koploper", e:"🏆", n:"Koploper", d:"Staat nu bovenaan de stand"},
  {id:"dreef", e:"🔥", n:"Op dreef", d:"3 keer op rij gewonnen"},
  {id:"onstuitbaar", e:"🚀", n:"Onstuitbaar", d:"5 keer op rij gewonnen"},
  {id:"muur", e:"🛡️", n:"De muur", d:"5 wedstrijden op rij ongeslagen"},
  {id:"altijd", e:"💯", n:"Nooit gemist", d:"Bij elke wedstrijd aanwezig (min. 4)"},
  {id:"trouw", e:"🗓️", n:"Trouwe kracht", d:"Opkomst van 75% of meer"},
  {id:"veteraan", e:"🎖️", n:"Veteraan", d:"10 wedstrijden gespeeld"},
  {id:"nul", e:"🧤", n:"De nul", d:"3 keer gewonnen zonder tegengoal"},
  {id:"kanon", e:"💥", n:"Kanonnade", d:"Een wedstrijd met 5+ verschil gewonnen"},
  {id:"joker", e:"🃏", n:"Jokerkoning", d:"Vaakst joker geweest (min. 2)"},
  {id:"motm", e:"⭐", n:"Man of the match", d:"Minstens 1 keer gekozen"},
  {id:"reus", e:"😮", n:"Reuzendoder", d:"Won terwijl de tegenpartij duidelijke favoriet was"},
  {id:"klimmer", e:"📈", n:"Klimmer", d:"Steeg 3+ plekken na de laatste wedstrijd"},
  {id:"pech", e:"🌧️", n:"Pechvogel", d:"3 keer op rij verloren (komt goed!)"},
];
function badgesFor(s){
  const h = playerHistory(s), total = s.uitslagen.length, res = {};
  const give = (n,id)=>{ (res[n]??=new Set()).add(id); };
  const rows = standing(s); if(rows.length) rows.filter(r=>r.pts===rows[0].pts).forEach(r=>give(r.name,"koploper"));
  const jokers = {}; s.uitslagen.forEach(u=>{ if(u.joker) jokers[u.joker]=(jokers[u.joker]||0)+1; });
  const maxJ = Math.max(0,...Object.values(jokers)); if(maxJ>=2) Object.entries(jokers).filter(([,c])=>c===maxJ).forEach(([n])=>give(n,"joker"));
  s.uitslagen.forEach(u=>{ if(u.motm) give(u.motm,"motm"); });
  const fair = fairness(s);
  for(const [n,list] of Object.entries(h)){
    const sk = streaks(list); let lossRun=0, maxLoss=0, clean=0, kanon=false, reus=false;
    for(const m of list){ lossRun = m.res==="V"? lossRun+1:0; maxLoss=Math.max(maxLoss,lossRun);
      const u=m.u, mine = m.side==="B"?+u.scoreB:+u.scoreA, theirs = m.side==="B"?+u.scoreA:+u.scoreB;
      if(m.side!=="J" && m.res==="W" && theirs===0) clean++;
      if(m.side!=="J" && m.res==="W" && mine-theirs>=5) kanon=true;
      const f = fair.get(u); if(f && f.fav && Math.abs(f.pr.d)>=1.2 && m.side!=="J" && m.res==="W" && f.fav!==m.side) reus=true; }
    if(sk.bestW>=3) give(n,"dreef"); if(sk.bestW>=5) give(n,"onstuitbaar"); if(sk.bestUnb>=5) give(n,"muur");
    if(total>=4 && list.length===total) give(n,"altijd"); if(total>=4 && list.length/total>=0.75) give(n,"trouw");
    if(list.length>=10) give(n,"veteraan"); if(clean>=3) give(n,"nul"); if(kanon) give(n,"kanon"); if(reus) give(n,"reus");
    if(maxLoss>=3) give(n,"pech");
  }
  // klimmer: positie voor en na de laatste speeldag
  const dates = [...new Set(s.uitslagen.map(u=>u.dateISO))].sort();
  if(dates.length>=2){
    const last = dates[dates.length-1];
    const pos = arr=>{ const m={}; let r=0,pv=null; arr.forEach((p,i)=>{ if(p.pts!==pv){r=i+1;pv=p.pts;} m[p.name]=r; }); return m; };
    const before = pos(standing({uitslagen:s.uitslagen.filter(u=>u.dateISO<last)})), after = pos(rows);
    for(const n in after) if(before[n] && before[n]-after[n]>=3) give(n,"klimmer");
  }
  return res;
}
const badgeIcons = set=>set&&set.size?`<span class="mini" title="badges">${BADGES.filter(b=>set.has(b.id)).map(b=>b.e).join("")}</span>`:"";
function makeSuggestions(present, joker, count=3){
  const stats = computeStats(allState());   // sterkte over alle seizoenen
  let pool = present.filter(n => n !== joker);
  const avoid = state.avoidPairs || [];
  const seen = new Set(), out = [];
  const tries = 4000;
  const half = Math.floor(pool.length/2);
  const cands = [];
  for(let t=0;t<tries;t++){
    const sh = [...pool].sort(()=>Math.random()-.5);
    const A = sh.slice(0, half).sort(), B = sh.slice(half).sort();
    const key = A.join("|") < B.join("|") ? A.join("|")+"#"+B.join("|") : B.join("|")+"#"+A.join("|");
    if(seen.has(key)) continue; seen.add(key);
    const sa = A.reduce((t,n)=>t+strength(stats,n),0), sb = B.reduce((t,n)=>t+strength(stats,n),0);
    let pen = Math.abs(sa - sb);
    for(const pr of avoid){ const [x,y] = Array.isArray(pr) ? pr : [pr.a, pr.b];
      if((A.includes(x)&&A.includes(y)) || (B.includes(x)&&B.includes(y))) pen += 5; }
    cands.push({A, B, sa, sb, pen});
  }
  cands.sort((x,y)=>x.pen-y.pen);
  for(const c of cands){ if(out.length>=count) break; out.push(c); }
  return out;
}

let pasteOpen = false, pasteText = "", pasteRes = null, pasteReplace = true;
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let prev=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1, d[j-1]+1, prev+(a[i-1]===b[j-1]?0:1)); prev=t; } } return d[b.length]; }
// Haal namen uit een geplakt WhatsApp-lijstje. Regels onder een kopje als "afgemeld" of met ❌ tellen niet mee.
function parsePaste(text){
  const out = []; let skip = false;
  for(let line of text.split(/\r?\n/)){
    line = line.replace(/^\s*\[[^\]]*\]\s*/,"").replace(/^\s*\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4},?\s+\d{1,2}:\d{2}\s*-\s*/,"");
    const low = line.toLowerCase();
    if(/afgemeld|afmeld|kan niet|niet aanwezig|afwezig|helaas niet|komen niet|^\s*niet\b/.test(low)){ skip = true; if(!/[:]\s*\S/.test(line)) continue; line = line.split(":").slice(1).join(":"); }
    else if(/aanwezig|aangemeld|wie komt|komen|erbij|deelnemers|lijst/.test(low) && !/\d\s*[.)]/.test(line)){ skip = false; if(!/[:]\s*\S/.test(line)) continue; line = line.split(":").slice(1).join(":"); }
    if(skip || /❌|✖|🚫/.test(line)) continue;
    line = line.replace(/^\s*(\d+\s*[.)\-:]|[-•*·–]|\+)\s*/,"");
    for(let part of line.split(/,|;|\/|\s+en\s+|&/)){
      part = part.replace(/[^\p{L}\p{N}\s.'-]/gu," ").replace(/\b(ik|ben|erbij|aanwezig|ja|komt|kom|graag|ook|plus|\+1)\b/gi," ").replace(/\s+/g," ").trim();
      if(/\d/.test(part) || part.split(" ").length>3) continue;
      if(/\b(voetbal|training|wedstrijd|maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag|vanavond|morgen|uur|veld)\b/i.test(part) && state && matchName(part).status!=="ok") continue;
      if(part.length>=2 && part.length<=30 && /\p{L}/u.test(part)) out.push(part);
    }
  }
  return [...new Map(out.map(x=>[norm(x),x])).values()];
}
function matchName(raw){
  const n = norm(raw), players = state.players.map(p=>p.name), N = players.map(norm);
  if(["jij","you","ik","me"].includes(n)){ const me = state.adminName && players.includes(state.adminName) ? state.adminName : (players.find(p=>norm(p)==="bobby")||players[0]);
    return {status:"ambig", options:[me, ...players.filter(p=>p!==me)], me:true}; }
  let i = N.indexOf(n); if(i>=0) return {status:"ok", name:players[i]};
  // contactnaam zoals "Jamie Voetbal" of "Alex Jansen": kijk naar voornaam (+ eerste letter achternaam)
  const w = n.split(" ");
  if(w.length>1){
    const byFirst = players.filter((p,k)=>N[k]===w[0] || N[k].split(" ")[0]===w[0]);
    if(byFirst.length===1) return {status:"ok", name:byFirst[0], fuzzy:true};
    if(byFirst.length>1){ const ini = byFirst.filter(p=>norm(p).split(" ").slice(1).some(x=>w.slice(1).some(y=>y.startsWith(x)||x.startsWith(y))));
      if(ini.length===1) return {status:"ok", name:ini[0], fuzzy:true};
      return {status:"ambig", options:byFirst}; }
  }
  const first = players.filter((p,k)=>N[k].split(" ")[0]===n || N[k].replace(/ /g,"")===n.replace(/ /g,""));
  if(first.length===1) return {status:"ok", name:first[0]};
  if(first.length>1) return {status:"ambig", options:first};
  const starts = players.filter((p,k)=>N[k].startsWith(n) && n.length>=3);
  if(starts.length===1) return {status:"ok", name:starts[0]};
  if(starts.length>1) return {status:"ambig", options:starts};
  const scored = players.map((p,k)=>({p, d: Math.min(lev(n,N[k]), lev(n,N[k].split(" ")[0]))})).sort((a,b)=>a.d-b.d);
  const max = n.length>=6 ? 2 : 1;
  if(scored[0] && scored[0].d<=max){ const best = scored.filter(x=>x.d===scored[0].d); if(best.length===1) return {status:"ok", name:best[0].p, fuzzy:true}; return {status:"ambig", options:best.map(x=>x.p)}; }
  return {status:"new"};
}
function runPaste(text, names){ pasteText = text!==undefined ? text : document.getElementById("pasteTxt").value; pasteRes = (names || parsePaste(pasteText)).map(raw=>({raw, ...matchName(raw), pick:null, add:false})); 
  pasteRes.forEach(r=>{ if(r.status==="ambig") r.pick = r.options[0]; }); render(); }
function viewPaste(){
  const shotBtn = (cls)=>`<label class="btn ${cls}" style="flex:1;text-align:center">📷 Poll-screenshot<input type="file" accept="image/*" multiple hidden onchange="ocrFiles(this.files)"></label>`;
  if(!pasteOpen) return `<div class="row" style="margin-bottom:12px;flex-wrap:nowrap">${shotBtn("wa")}<button class="btn wa" style="flex:1" onclick="pasteOpen=true;render()">📋 Lijstje plakken</button></div>`;
  let html = `<div class="card"><div class="row spread"><h2>📋 Aanmelden vanuit WhatsApp</h2><button class="btn sm" onclick="pasteOpen=false;pasteRes=null;pasteText='';ocrMsg='';render()">Sluiten</button></div>
    <div class="row" style="margin-bottom:8px">${shotBtn("")}</div>
    ${ocrMsg?`<p class="small" style="margin:0 0 8px">${esc(ocrMsg)}</p>`:""}
    <p class="small muted" style="margin-top:0">Upload een screenshot van <b>Stemmen bekijken</b> uit de WhatsApp-poll (alleen de namen onder "Ja" tellen), of plak een lijstje. Namen onder "afgemeld"/"Nee" of met ❌ worden overgeslagen.</p>
    <textarea id="pasteTxt" placeholder="1. Jamie\n2. Peter ✅\n3. alex j\n\nAfgemeld: Rob">${esc(pasteText)}</textarea>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="runPaste()">Namen herkennen</button>`;
  if(pasteRes){
    const ok = pasteRes.filter(r=>r.status==="ok"||(r.status==="ambig"&&r.pick)||(r.status==="new"&&r.add)).length;
    html += `<div style="margin-top:12px">${pasteRes.length?pasteRes.map((r,i)=>`<div class="pm"><span>${
      r.status==="ok" ? `<span class="tagok">✓ ${esc(r.name)}</span>${norm(r.raw)!==norm(r.name)?` <span class="src">uit "${esc(r.raw)}"${r.fuzzy?" (lijkt op)":""}</span>`:""}` :
      r.status==="ambig" ? `<span class="tagq">? "${esc(r.raw)}"${r.me?` <span class="src">(jijzelf)</span>`:""}</span>` :
      `<span class="tagno">"${esc(r.raw)}" onbekend</span>`}</span><span>${
      r.status==="ambig" ? `<select onchange="pasteRes[${i}].pick=this.value;render()">${r.options.map(o=>`<option ${o===r.pick?"selected":""}>${esc(o)}</option>`).join("")}<option value="">overslaan</option></select>` :
      r.status==="new" ? `<label class="small"><input type="checkbox" ${r.add?"checked":""} onchange="pasteRes[${i}].add=this.checked;render()"> toevoegen</label>` : ""}</span></div>`).join(""):`<p class="small muted">Geen namen gevonden.</p>`}</div>
      <label class="small row" style="margin-top:10px"><input type="checkbox" ${pasteReplace?"checked":""} onchange="pasteReplace=this.checked"> Wie niet in de lijst staat afmelden</label>
      <button class="btn primary" style="width:100%;margin-top:8px" onclick="applyPaste()" ${pasteRes.length?"":"disabled"}>Zet ${ok} speler${ok===1?"":"s"} op aanwezig</button>`;
  }
  return html + `</div>`;
}
/* ---------- Poll-screenshot uitlezen (OCR op het apparaat zelf) ---------- */
let ocrMsg = "", tessLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return tessLoading ??= new Promise((res, rej)=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload=res; sc.onerror=()=>{ tessLoading=null; rej(new Error("Tekstherkenning kon niet laden (geen internet?)")); }; document.head.appendChild(sc); });
}
// Maak het plaatje beter leesbaar: grijs, donkere modus omkeren, vergroten
function prepImage(file){ return new Promise((res, rej)=>{ const img=new Image(); img.onload=()=>{
  const scale = img.width < 1000 ? 2 : 1, c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
  const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height); const d=x.getImageData(0,0,c.width,c.height), a=d.data; let sum=0;
  for(let i=0;i<a.length;i+=4){ const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2]; a[i]=a[i+1]=a[i+2]=g; sum+=g; }
  if(sum/(a.length/4) < 110) for(let i=0;i<a.length;i+=4){ a[i]=a[i+1]=a[i+2]=255-a[i]; }
  x.putImageData(d,0,0); URL.revokeObjectURL(img.src); res(c); }; img.onerror=()=>rej(new Error("Afbeelding kon niet worden geopend")); img.src=URL.createObjectURL(file); }); }
// Uit de OCR-tekst van "Stemmen bekijken": namen onder "Ja" tot aan "Nee"
function parsePoll(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const hasJa = lines.some(l=>/^(ja|yes)\b/i.test(l));
  let mode = hasJa ? null : "ja"; const out = [];
  for(const l of lines){
    if(/^(ja|yes)\b/i.test(l)){ mode="ja"; continue; }
    if(/^(nee|no|misschien|maybe)\b/i.test(l)){ mode="other"; continue; }
    if(mode!=="ja") continue;
    if(/\d/.test(l) || /^(vandaag|gisteren|today|yesterday|pollgegevens|poll details|alles bekijken|view all|meer|stem)/i.test(l)) continue;
    const name = l.replace(/[^\p{L}\s.'-]/gu," ").split(/\s+/).filter(w=>w.length>1 || /^[A-Z]$/.test(w)).join(" ").trim();
    if(name.length>=2 && name.split(" ").length<=4) out.push(name);
  }
  return [...new Map(out.map(x=>[norm(x),x])).values()];
}
async function ocrFiles(files){
  if(!files || !files.length) return;
  pasteOpen = true; pasteRes = null; ocrMsg = "Tekstherkenning laden…"; render();
  try{
    await loadTesseract();
    const worker = await Tesseract.createWorker("nld", 1, { logger: m=>{ if(m.status==="recognizing text"){ ocrMsg = `Screenshot lezen… ${Math.round(m.progress*100)}%`; const el=document.querySelector("#app .card p.small"); if(el && el.textContent.startsWith("Screenshot")) el.textContent = ocrMsg; } } });
    let names = [];
    for(let i=0;i<files.length;i++){ ocrMsg = `Screenshot ${i+1} van ${files.length} lezen…`; render();
      const canvas = await prepImage(files[i]); const { data } = await worker.recognize(canvas); names.push(...parsePoll(data.text)); }
    await worker.terminate();
    names = [...new Map(names.map(x=>[norm(x),x])).values()];
    ocrMsg = names.length ? `${names.length} namen gevonden onder "Ja". Controleer de lijst hieronder.` : `Geen namen gevonden. Maak een screenshot van "Stemmen bekijken" waar "Ja" bovenaan staat.`;
    runPaste(names.join("\n"), names);
  }catch(e){ ocrMsg = e.message || String(e); render(); }
}
function applyPaste(){
  const names = new Set(), adds = [];
  const meName = (pasteRes.find(r=>r.me && r.pick)||{}).pick;
  for(const r of pasteRes){ if(r.status==="ok") names.add(r.name); else if(r.status==="ambig" && r.pick) names.add(r.pick); else if(r.status==="new" && r.add){ const nm = r.raw.replace(/\b\w/g,c=>c.toUpperCase()); adds.push(nm); names.add(nm); } }
  const replace = pasteReplace;
  mutate(s=>{ if(meName) s.adminName = meName; for(const a of adds) if(!s.players.some(p=>norm(p.name)===norm(a))) s.players.push({name:a, present:false});
    for(const p of s.players){ if(names.has(p.name)) p.present = true; else if(replace) p.present = false; } },
    `${names.size} speler${names.size===1?"":"s"} aangemeld`).then(ok=>{ if(ok){ pasteOpen=false; pasteRes=null; pasteText=""; ocrMsg=""; suggestions=[]; render(); } });
}

function fixedJoker(){ return state.fixedJoker === undefined ? "Peter" : state.fixedJoker; }
// Joker bij oneven aantal: handmatige keuze > vaste joker (als aanwezig) > willekeurig
function pickJoker(present){
  if(window._joker && present.includes(window._joker)) return window._joker;
  const f = fixedJoker();
  window._joker = f && present.includes(f) ? f : present[Math.floor(Math.random()*present.length)];
  return window._joker;
}
function setFixedJoker(n){ window._joker = null; suggestions = []; mutate(s=>{ s.fixedJoker = n || null; }, n ? n+" is nu de vaste joker" : "Geen vaste joker"); }
function randomJoker(){ const pr=state.players.filter(p=>p.present).map(p=>p.name); const others=pr.filter(n=>n!==window._joker); const pool=others.length?others:pr; window._joker=pool[Math.floor(Math.random()*pool.length)]; newSuggestions(); }
function newSuggestions(silent){ const present=state.players.filter(p=>p.present).map(p=>p.name);
  const joker = present.length%2 ? window._joker : null; suggestions = makeSuggestions(present, joker); suggestions.joker = joker; suggestions.key = present.join("|"); selSugg=0; if(!silent) render(); }
function confirmTeams(){
  const s0 = suggestions[selSugg]; if(!s0) return;
  const t = teamsObj(s0.A, s0.B);
  const present = state.players.filter(p=>p.present).map(p=>p.name);
  const joker = present.length%2 ? (window._joker||null) : null;
  draft = null;
  mutate(s=>{ s.lastTeams=t; s.currentJoker=joker; s.lastTeamsLogged=false; }, "Teams vastgezet").then(ok=>{ if(ok){ suggestions=[]; render(); } });
}
function setSide(n, v){ if(v) draft.side[n]=v; else delete draft.side[n];
  if(v==="J") for(const k in draft.side) if(k!==n && draft.side[k]==="J") delete draft.side[k];
  render(); }
function saveUitslag(){
  const A = Object.keys(draft.side).filter(n=>draft.side[n]==="A");
  const B = Object.keys(draft.side).filter(n=>draft.side[n]==="B");
  const J = Object.keys(draft.side).find(n=>draft.side[n]==="J") || null;
  if(!A.length || !B.length){ toast("Zet spelers in beide teams"); return; }
  if(!draft.dateISO){ toast("Kies een datum"); return; }
  const idx = editIdx;
  const base = idx!==null ? state.uitslagen[idx] : {};
  const u = {...base, teamAName: base.teamAName||TEAM_A, teamBName: base.teamBName||TEAM_B, teamA:A, teamB:B,
    scoreA:+draft.scoreA||0, scoreB:+draft.scoreB||0, date:fmtDate(draft.dateISO), dateISO:draft.dateISO,
    joker:J, motm:draft.motm||null, goalsA: base.goalsA||{}, goalsB: base.goalsB||{}};
  const origKey = idx!==null ? JSON.stringify(state.uitslagen[idx]) : null;
  mutate(s=>{
    if(idx!==null){ const j=s.uitslagen.findIndex(x=>JSON.stringify(x)===origKey); if(j>=0) s.uitslagen[j]=u; else throw new Error("Uitslag is intussen gewijzigd, probeer opnieuw"); }
    else { s.uitslagen.push(u); s.lastTeamsLogged=true; }
    s.uitslagen.sort((x,y)=>(y.dateISO||"").localeCompare(x.dateISO||""));
  }, idx!==null?"Uitslag bijgewerkt":"Uitslag opgeslagen").then(ok=>{ if(ok){ editIdx=null; draft=null; render(); } });
}
function editUitslag(i){ editIdx=i; draft=draftFromUitslag(state.uitslagen[i]); render(); scrollTo(0,0); }
function cancelEdit(){ editIdx=null; draft=null; render(); }
function deleteUitslag(i){ const u=state.uitslagen[i]; if(!confirm(`Uitslag van ${u.date} (${u.scoreA}-${u.scoreB}) verwijderen?`)) return;
  const key=JSON.stringify(u); editIdx=null; draft=null;
  mutate(s=>{ s.uitslagen=s.uitslagen.filter(x=>JSON.stringify(x)!==key); }, "Uitslag verwijderd", false, true); }

document.getElementById("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.tab); });
(async function init(){
  const m = new URLSearchParams(location.search).get("mode");
  if(["aanwezig","suggestions","uitslag","stand"].includes(m)) tab=m;
  const sp = new URLSearchParams(location.search).get("speler"); if(sp){ tab="stand"; profileName=sp; }
  render();
  try{ state = await fetchState(); setStatus("Bijgewerkt " + new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})); }
  catch(e){ setStatus(e.message, true); document.getElementById("app").innerHTML=`<div class="card empty err">${esc(e.message)}</div>`; return; }
  render();
})();
// Ververs als de app weer in beeld komt (bijv. telefoon uit de zak)
document.addEventListener("visibilitychange", async ()=>{ if(document.visibilityState==="visible" && state && editIdx===null){ try{ state=await fetchState(); render(); }catch{} } });
// Op een ander tabblad in- of uitgelogd
window.addEventListener("storage", e=>{ if(e.key===ADMIN_KEY && state) render(); });
